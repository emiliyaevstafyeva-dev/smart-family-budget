<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>core-smoke</title></head>
<body><pre id="out">running…</pre>
<script src="./budget-core.js"></script>
<script>
(function () {
  var Core = window.BudgetCore;
  var passed = 0, failed = 0, messages = [];
  function assert(cond, msg) {
    if (cond) passed++;
    else { failed++; messages.push(msg); }
  }
  function assertEq(a, b, msg) {
    assert(a === b, msg + ' (got ' + a + ', expected ' + b + ')');
  }
  function rubInput(cfg) {
    var incomes = cfg.incomes || [];
    return Core.calculateBudget({
      openingBalanceRubles: cfg.opening || 0,
      incomeRows: incomes,
      getIncomeAmount: function (idx) { return Number(incomes[idx] && incomes[idx].amount) || 0; },
      fixedRows: cfg.fixed || [],
      onceRows: cfg.once || [],
      dailyExpenses: cfg.daily || [],
      selectedMonth: cfg.selectedMonth || { year: 2026, month: 9, days: 30 },
      viewDay: cfg.viewDay != null ? cfg.viewDay : 1,
      isMonthLocked: function () { return false; }
    });
  }

  var r = rubInput({
    incomes: [{ name: 'Зарплата', day: 5, amount: 100000 }],
    fixed: [{ name: 'Кредит', day: 10, amount: 25000 }]
  });
  assert(r.history.some(function (h) { return h.type === 'payment' && h.name === 'Кредит'; }), '1: кредит оплачен');
  assertEq(r.arrearsTotal, 0, '1: нет просрочки');

  r = rubInput({
    incomes: [{ name: 'З1', day: 5, amount: 100000 }, { name: 'З2', day: 20, amount: 80000 }],
    fixed: [{ name: 'Кредит', day: 10, amount: 20000 }],
    once: [{ name: 'Стоматолог', date: '2026-09-16', amount: 30000 }]
  });
  var c5 = r.incomeCards.filter(function (c) { return c.day === 5; })[0];
  var dent = c5.allocations.filter(function (a) { return a.name === 'Стоматолог'; })[0];
  assert(dent && dent.fullyFunded && dent.dueBeforeNextIncome, '4: стоматолог из дохода 5');

  r = rubInput({
    opening: 0,
    incomes: [{ name: 'З1', day: 5, amount: 100000 }],
    fixed: [{ name: 'Кредит', day: 3, amount: 10000 }]
  });
  assert(r.history.some(function (h) { return h.type === 'arrears'; }), '6: просрочка');
  assert(r.history.some(function (h) { return h.type === 'arrears_payment'; }), '7: погашение');
  assertEq(r.arrearsTotal, 0, '7: просрочка закрыта');

  r = rubInput({
    incomes: [
      { name: 'Зарплата', day: 5, amount: 100000 },
      { name: 'Второй доход', day: 20, amount: 80000 }
    ],
    fixed: [
      { name: 'Кредит', day: 10, amount: 25000 },
      { name: 'ЖКХ', day: 15, amount: 10000 },
      { name: 'Другой кредит', day: 25, amount: 20000 }
    ],
    once: [{ name: 'Стоматолог', date: '2026-09-18', amount: 30000 }]
  });
  assertEq(r.arrearsTotal, 0, 'tz: без просрочки');
  c5 = r.incomeCards.filter(function (c) { return c.day === 5; })[0];
  assertEq(c5.remaining, 10000, 'tz: свободно 10000');
  assertEq(c5.totalReserve, 65000, 'tz: резерв 65000');
  assertEq(r._kop.cash, r._kop.reserved + r._kop.free, 'inv: Cash=Reserved+Free');

  var s = Core.splitIncome(10000000);
  assertEq(s.savings, 2500000, '25%');
  assertEq(s.savings + s.usable, 10000000, 'доход=накопления+usable');

  document.getElementById('out').textContent = JSON.stringify({
    passed: passed, failed: failed, messages: messages, ok: failed === 0
  }, null, 2);
  document.title = failed === 0 ? 'PASS:' + passed : 'FAIL:' + failed;
})();
</script>
</body></html>
